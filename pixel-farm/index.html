<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Farm</title>
    <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=20260131"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #2d5a1e;
            font-family: 'Courier New', monospace;
            user-select: none;
        }

        #game-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #debug-overlay {
            position: fixed;
            top: 8px;
            left: 8px;
            color: #ffffff;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            z-index: 500;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            line-height: 1.5;
            display: none;
        }

        #debug-overlay.visible {
            display: block;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0a0a0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <div id="loading">Loading assets...</div>
    <canvas id="game-canvas"></canvas>
    <div id="debug-overlay"></div>

    <script>
    // ============================================================
    // CONSTANTS
    // ============================================================
    const TILE_SIZE = 48;         // native grass tile size in px
    const SPRITE_FRAME = 16;      // native character frame size
    const SPRITE_SCALE = 3;       // scale character to match tiles (16*3=48)
    const CHAR_SIZE = SPRITE_FRAME * SPRITE_SCALE; // 48px rendered

    const WORLD_TILES = 20;
    const WORLD_PIXELS = WORLD_TILES * TILE_SIZE;

    // 1 Portals unit = 1 tile
    const UNITY_SCALE = TILE_SIZE;

    // Sprite sheet layout (hero.png: 48x64, 3 cols x 4 rows, each frame 16x16)
    // Row 0: Left, Row 1: Up (back), Row 2: Down (facing camera), Row 3: Right
    const DIR_LEFT  = 0;
    const DIR_UP    = 1;
    const DIR_DOWN  = 2;
    const DIR_RIGHT = 3;

    // Walk animation: cycle through frames 0→1→0→2 (standing→step1→standing→step2)
    const WALK_CYCLE = [0, 1, 0, 2];
    const ANIM_FRAME_MS = 150; // ms per animation frame

    // Render scale (computed on resize - fits world width to screen width)
    let renderScale = 1;

    // ============================================================
    // ASSET LOADING
    // ============================================================
    const assets = {};

    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Failed to load: ' + src));
            img.src = src;
        });
    }

    async function loadAllAssets() {
        const [hero, grass] = await Promise.all([
            loadImage('assets/hero.png'),
            loadImage('assets/grass-tile-2.png'),
        ]);
        assets.hero = hero;
        assets.grass = grass;
    }

    // ============================================================
    // GAME STATE
    // ============================================================
    const gameState = {
        running: false,
        camera: { x: 0, y: 0 },
        localUsername: null,
        players: new Map(),
        localPlayer: null,
        lastFrameTime: 0,
        debugMode: false
    };

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // ============================================================
    // TILEMAP
    // ============================================================

    function drawTilemap(ctx) {
        // Only draw visible rows (camera.x is always 0, full width visible)
        const viewHeight = canvas.height / renderScale;
        const startY = Math.max(0, Math.floor(gameState.camera.y / TILE_SIZE));
        const endY = Math.min(WORLD_TILES, Math.ceil((gameState.camera.y + viewHeight) / TILE_SIZE) + 1);

        for (let y = startY; y < endY; y++) {
            for (let x = 0; x < WORLD_TILES; x++) {
                ctx.drawImage(assets.grass, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    // ============================================================
    // CHARACTER SPRITE
    // ============================================================

    function drawHeroSprite(ctx, screenX, screenY, direction, frameIndex) {
        // screenX/screenY = center-bottom (feet position) of character
        // Sprite sheet: 3 cols x 4 rows, each frame 16x16
        // Right = horizontally flipped Left (row 3 is unreliable)
        const useFlip = (direction === DIR_RIGHT);
        const srcRow = useFlip ? DIR_LEFT : direction;
        const srcX = frameIndex * SPRITE_FRAME;
        const srcY = srcRow * SPRITE_FRAME;

        const drawX = Math.floor(screenX - CHAR_SIZE / 2);
        const drawY = Math.floor(screenY - CHAR_SIZE);

        if (useFlip) {
            ctx.save();
            ctx.translate(screenX, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(
                assets.hero,
                srcX, srcY, SPRITE_FRAME, SPRITE_FRAME,
                -CHAR_SIZE / 2, drawY, CHAR_SIZE, CHAR_SIZE
            );
            ctx.restore();
        } else {
            ctx.drawImage(
                assets.hero,
                srcX, srcY, SPRITE_FRAME, SPRITE_FRAME,
                drawX, drawY, CHAR_SIZE, CHAR_SIZE
            );
        }
    }

    function drawPlayerName(ctx, centerX, topY, name) {
        ctx.font = '11px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';

        // Outline
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            ctx.fillText(name, centerX + dx, topY + dy);
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillText(name, centerX, topY);
    }

    // ============================================================
    // PLAYER OBJECT
    // ============================================================

    function createPlayer(username, canvasX, canvasY) {
        return {
            username,
            x: canvasX,
            y: canvasY,
            targetX: canvasX,
            targetY: canvasY,
            direction: DIR_DOWN,
            keys: { w: 0, a: 0, s: 0, d: 0 },
            walkCycleIndex: 0,
            animTimer: 0,
            moving: false
        };
    }

    function updatePlayerAnimation(player, dt) {
        const { w, a, s, d } = player.keys;
        const anyKey = w || a || s || d;

        // Detect movement from position delta
        const dx = player.targetX - player.x;
        const dy = player.targetY - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (anyKey) {
            // Key data available: use keys for direction
            player.moving = true;
            if (w && !s)      player.direction = DIR_UP;
            else if (s && !w) player.direction = DIR_DOWN;
            else if (a && !d) player.direction = DIR_LEFT;
            else if (d && !a) player.direction = DIR_RIGHT;
        } else if (dist > 1.5) {
            // No key data but position is changing: infer direction from movement
            player.moving = true;
            if (Math.abs(dx) > Math.abs(dy)) {
                player.direction = dx > 0 ? DIR_RIGHT : DIR_LEFT;
            } else {
                player.direction = dy > 0 ? DIR_DOWN : DIR_UP;
            }
        } else {
            player.moving = false;
        }

        if (player.moving) {
            player.animTimer += dt;
            if (player.animTimer >= ANIM_FRAME_MS) {
                player.animTimer -= ANIM_FRAME_MS;
                player.walkCycleIndex = (player.walkCycleIndex + 1) % WALK_CYCLE.length;
            }
        } else {
            player.walkCycleIndex = 0;
            player.animTimer = 0;
        }
    }

    function getPlayerFrame(player) {
        return WALK_CYCLE[player.walkCycleIndex];
    }

    // ============================================================
    // COORDINATE MAPPING
    // ============================================================

    // Unity (0,0) maps to the center of the tile world
    const WORLD_CENTER_X = (WORLD_TILES / 2) * TILE_SIZE;
    const WORLD_CENTER_Y = (WORLD_TILES / 2) * TILE_SIZE;

    function unityToCanvas(unityX, unityZ) {
        return {
            x: WORLD_CENTER_X + (unityX * UNITY_SCALE),
            y: WORLD_CENTER_Y - (unityZ * UNITY_SCALE)
        };
    }

    // ============================================================
    // PORTALS SDK INTEGRATION
    // ============================================================

    function initPortalsSDK() {
        if (typeof PortalsSdk === 'undefined') {
            console.log('PortalsSdk not available - standalone mode');
            return;
        }

        PortalsSdk.setMessageListener((message) => {
            console.log('Received:', message);
            handlePortalsMessage(message);
        });
    }

    function handlePortalsMessage(message) {
        // Position data: {"player1"="(x, y, z)", "player2"="(x, y, z)"}
        if (message.includes('="(') || message.includes('= "(')) {
            parsePositionData(message);
            return;
        }

        // Key state: w:{"player"="1"}, a:{"player"="0"}, s:..., d:...
        const keyMatch = message.match(/^([wasd]):/);
        if (keyMatch) {
            parseKeyData(keyMatch[1], message.substring(2));
            return;
        }

        // Username: "playerName"
        if (message.startsWith('"') && !message.includes('=')) {
            gameState.localUsername = message.replace(/"/g, '').trim();
            console.log('Local username:', gameState.localUsername);
            return;
        }
    }

    function parseKeyData(key, data) {
        // Format: {"buster"="1", "player2"="0"}
        let str = data.trim();
        if (str.startsWith('{')) str = str.substring(1);
        if (str.endsWith('}')) str = str.substring(0, str.length - 1);

        const pattern = /"([^"]+)"\s*=\s*"([^"]*)"/g;
        let match;
        while ((match = pattern.exec(str)) !== null) {
            const username = match[1];
            const val = parseInt(match[2], 10) || 0;
            const player = gameState.players.get(username);
            if (player) {
                player.keys[key] = val;
            }
        }
    }

    function parsePositionData(message) {
        console.log('parsePositionData called with:', message);
        let data = message.trim();
        if (data.startsWith('{')) data = data.substring(1);
        if (data.endsWith('}')) data = data.substring(0, data.length - 1);
        console.log('Stripped data:', data);

        const pattern = /"([^"]+)"\s*=\s*"\(([^)]+)\)"/g;
        let match;
        let matchCount = 0;

        while ((match = pattern.exec(data)) !== null) {
            matchCount++;
            const username = match[1];
            const coords = match[2].split(',').map(s => parseFloat(s.trim()));
            console.log('Matched player:', username, 'coords:', coords);

            if (coords.length >= 3) {
                const [ux, uy, uz] = coords;
                const pos = unityToCanvas(ux, uz);
                console.log('Canvas pos:', pos.x, pos.y);

                if (gameState.players.has(username)) {
                    const player = gameState.players.get(username);
                    player.targetX = pos.x;
                    player.targetY = pos.y;
                } else {
                    const player = createPlayer(username, pos.x, pos.y);
                    gameState.players.set(username, player);
                    console.log('Created player:', username, 'at', pos.x, pos.y);
                }

                // Identify local player
                if (gameState.localUsername && username === gameState.localUsername) {
                    gameState.localPlayer = gameState.players.get(username);
                }
            }
        }

        if (matchCount === 0) {
            console.warn('No regex matches found in:', data);
        }

        // Single player fallback: assume first player is local
        if (!gameState.localUsername && gameState.players.size === 1) {
            const [username, player] = gameState.players.entries().next().value;
            gameState.localUsername = username;
            gameState.localPlayer = player;
            console.log('Set local player:', username);
        }

        console.log('Total players:', gameState.players.size, 'Local:', gameState.localUsername);
    }

    // ============================================================
    // CAMERA
    // ============================================================

    function updateCamera() {
        // X is always 0: full world width fits the screen
        gameState.camera.x = 0;

        const viewHeight = canvas.height / renderScale;

        // Find player to follow: local player, or first available player
        let followPlayer = gameState.localPlayer;
        if (!followPlayer && gameState.players.size > 0) {
            followPlayer = gameState.players.values().next().value;
        }

        let targetY;
        if (followPlayer) {
            targetY = followPlayer.y - viewHeight / 2;
        } else {
            targetY = WORLD_CENTER_Y - viewHeight / 2;
        }

        // Clamp target to world bounds
        const maxY = WORLD_PIXELS - viewHeight;
        if (maxY <= 0) {
            targetY = maxY / 2;
        } else {
            targetY = Math.max(0, Math.min(targetY, maxY));
        }

        // Smooth lerp toward target
        gameState.camera.y += (targetY - gameState.camera.y) * 0.08;
    }

    // ============================================================
    // GAME LOOP
    // ============================================================

    function update(dt) {
        const lerpSpeed = 0.12;

        for (const [, player] of gameState.players) {
            // Interpolate position
            player.x += (player.targetX - player.x) * lerpSpeed;
            player.y += (player.targetY - player.y) * lerpSpeed;

            // Update animation
            updatePlayerAnimation(player, dt);
        }
    }

    function render() {
        ctx.imageSmoothingEnabled = false;

        // Clear
        ctx.fillStyle = '#2d5a1e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Apply world transform: scale to fit width, translate for camera Y
        ctx.save();
        ctx.scale(renderScale, renderScale);
        ctx.translate(0, -gameState.camera.y);

        // Tilemap
        drawTilemap(ctx);

        // Players sorted by Y (depth sorting)
        const viewHeight = canvas.height / renderScale;
        const sorted = [...gameState.players.values()].sort((a, b) => a.y - b.y);

        for (const player of sorted) {
            // Cull offscreen (Y only, full width always visible)
            if (player.y < gameState.camera.y - CHAR_SIZE ||
                player.y > gameState.camera.y + viewHeight + CHAR_SIZE) continue;

            // Draw character sprite (world coordinates, transform handles the rest)
            const frame = getPlayerFrame(player);
            drawHeroSprite(ctx, player.x, player.y, player.direction, frame);

            // Draw name above head
            drawPlayerName(ctx, player.x, player.y - CHAR_SIZE - 4, player.username);
        }

        ctx.restore();
    }

    function gameLoop(timestamp) {
        if (!gameState.running) return;

        const dt = timestamp - gameState.lastFrameTime;
        gameState.lastFrameTime = timestamp;

        update(dt);
        updateCamera();
        render();
        updateDebugOverlay();

        requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        renderScale = canvas.width / WORLD_PIXELS;
    }

    // ============================================================
    // DEBUG
    // ============================================================

    function updateDebugOverlay() {
        if (!gameState.debugMode) return;
        const el = document.getElementById('debug-overlay');
        const lines = [
            `Players: ${gameState.players.size}`,
            `Local: ${gameState.localUsername || '?'}`,
            `Cam Y: ${Math.floor(gameState.camera.y)} Scale: ${renderScale.toFixed(2)}`
        ];
        if (gameState.localPlayer) {
            const p = gameState.localPlayer;
            lines.push(`Pos: ${Math.floor(p.x)}, ${Math.floor(p.y)}`);
            lines.push(`Dir: ${['down','left','right','up'][p.direction]} F:${getPlayerFrame(p)}`);
        }
        el.textContent = lines.join('\n');
    }

    // ============================================================
    // MOCK MODE (standalone testing without Portals)
    // ============================================================

    function startMockMode() {
        console.log('Mock mode - WASD to move');

        const center = unityToCanvas(0, 0);
        const local = createPlayer('TestPlayer', center.x, center.y);
        gameState.localUsername = 'TestPlayer';
        gameState.players.set('TestPlayer', local);
        gameState.localPlayer = local;

        // Second mock player wandering
        const otherPos = unityToCanvas(3, 2);
        const other = createPlayer('FarmFriend', otherPos.x, otherPos.y);
        gameState.players.set('FarmFriend', other);

        let angle = 0;
        setInterval(() => {
            angle += 0.03;
            const p = unityToCanvas(3 + Math.cos(angle) * 3, 2 + Math.sin(angle) * 3);
            const dx = p.x - other.targetX;
            const dy = p.y - other.targetY;
            other.keys = { w: 0, a: 0, s: 0, d: 0 };
            if (Math.abs(dx) > Math.abs(dy)) {
                other.keys[dx > 0 ? 'd' : 'a'] = 1;
            } else {
                other.keys[dy > 0 ? 's' : 'w'] = 1;
            }
            other.targetX = p.x;
            other.targetY = p.y;
        }, 100);

        // WASD movement for mock mode
        const speed = 4;
        const held = {};
        window.addEventListener('keydown', (e) => { held[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { held[e.key.toLowerCase()] = false; });

        setInterval(() => {
            if (!gameState.localPlayer) return;
            const p = gameState.localPlayer;

            // Set keys from keyboard (supports simultaneous presses)
            p.keys.w = (held['w'] || held['arrowup'])    ? 1 : 0;
            p.keys.s = (held['s'] || held['arrowdown'])  ? 1 : 0;
            p.keys.a = (held['a'] || held['arrowleft'])  ? 1 : 0;
            p.keys.d = (held['d'] || held['arrowright']) ? 1 : 0;

            if (p.keys.w) p.targetY -= speed;
            if (p.keys.s) p.targetY += speed;
            if (p.keys.a) p.targetX -= speed;
            if (p.keys.d) p.targetX += speed;

            // Keep inside world bounds
            const min = TILE_SIZE * 0.5;
            const max = WORLD_PIXELS - TILE_SIZE * 0.5;
            p.targetX = Math.max(min, Math.min(p.targetX, max));
            p.targetY = Math.max(min, Math.min(p.targetY, max));
        }, 16);
    }

    // ============================================================
    // INIT
    // ============================================================

    async function init() {
        try {
            await loadAllAssets();
        } catch (e) {
            document.getElementById('loading').textContent = 'Failed to load assets: ' + e.message;
            return;
        }

        // Hide loading screen
        document.getElementById('loading').style.display = 'none';

        // Setup canvas
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Debug toggle
        window.addEventListener('keydown', (e) => {
            if (e.key === '`') {
                gameState.debugMode = !gameState.debugMode;
                document.getElementById('debug-overlay').classList.toggle('visible', gameState.debugMode);
            }
        });

        // SDK
        initPortalsSDK();

        // Detect if we're inside a Portals iframe
        let inPortals = false;
        try {
            inPortals = (window !== window.top);
        } catch (e) {
            inPortals = true; // cross-origin = definitely in an iframe
        }
        console.log('inPortals:', inPortals);

        if (inPortals) {
            PortalsSdk.focusGameKeyboard();
        } else {
            startMockMode();
        }

        // Start
        gameState.running = true;
        gameState.lastFrameTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    window.addEventListener('load', init);
    </script>
</body>
</html>
