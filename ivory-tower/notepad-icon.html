<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Notepad Icon</title>
    <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
        }

        body {
            width: 56px;
            height: 56px;
            overflow: hidden;
            user-select: none;
        }

        .icon-button {
            width: 56px;
            height: 56px;
            background: rgba(40, 40, 45, 0.85);
            border: 2px solid #5a5a5a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .icon-button:hover {
            border-color: #7ec8e3;
            box-shadow: 0 0 12px rgba(126, 200, 227, 0.4), inset 0 0 8px rgba(126, 200, 227, 0.1);
        }

        .icon-button:active {
            transform: scale(0.95);
        }

        .icon-button svg {
            width: 32px;
            height: 32px;
            fill: #c8c8c8;
            transition: fill 0.15s ease;
        }

        .icon-button:hover svg {
            fill: #e8e8e8;
        }
    </style>
</head>
<body>
    <div class="icon-button" id="notepad-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <!-- Notepad/clipboard icon -->
            <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14H7v-2h3v2zm0-4H7v-2h3v2zm0-4H7V7h3v2zm7 8h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V7h4v2z"/>
        </svg>
    </div>

    <script>
        const notepadBtn = document.getElementById('notepad-btn');

        notepadBtn.addEventListener('click', () => {
            if (typeof PortalsSdk !== 'undefined') {
                PortalsSdk.setTaskActive('notepad');
                console.log('Notepad opened');
            }
        });
    </script>
</body>
</html>
