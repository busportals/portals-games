<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Inventory Tutorial</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Space Mono', monospace;
            overflow: visible;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        .tutorial-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transform: translateX(-117px);
        }

        .tutorial-text {
            background: rgba(30, 30, 35, 0.95);
            color: #e0e0e0;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            border: 2px solid rgba(126, 200, 227, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 12px rgba(126, 200, 227, 0.2);
            max-width: 280px;
            line-height: 1.4;
        }

        .arrow {
            width: 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 1s ease-in-out infinite;
        }

        .arrow svg {
            width: 40px;
            height: 60px;
            fill: #7ec8e3;
            filter: drop-shadow(0 0 8px rgba(126, 200, 227, 0.6));
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(8px);
            }
        }
    </style>
</head>
<body>
    <div class="tutorial-container">
        <div class="tutorial-text">
            Click on items in your inventory to use them
        </div>
        <div class="arrow">
            <svg viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0 L12 28 M4 20 L12 28 L20 20" stroke="#7ec8e3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>
</body>
</html>
